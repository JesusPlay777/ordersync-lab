name: ${COMPOSE_PROJECT_NAME:-ordersync-lab}

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ordersync}
      POSTGRES_USER: ${POSTGRES_USER:-ordersync}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ordersync_local}
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    ports:
      - "127.0.0.1:${ORDERSYNC_DB_PORT:-5433}:5432"
    volumes:
      - ordersync_postgres_data:/var/lib/postgresql/data

  api:
    build:
      context: .
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ordersync}
      POSTGRES_USER: ${POSTGRES_USER:-ordersync}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ordersync_local}
      POSTGRES_CONN_MAX_AGE: ${POSTGRES_CONN_MAX_AGE:-0}
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-ordersync-insecure-local-key}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-true}
      ORDERSYNC_MAX_ATTEMPTS: ${ORDERSYNC_MAX_ATTEMPTS:-3}
      ORDERSYNC_RETRY_DELAYS_SECONDS: ${ORDERSYNC_RETRY_DELAYS_SECONDS:-5,30}
      ORDERSYNC_JOB_LOCK_TIMEOUT_SECONDS: ${ORDERSYNC_JOB_LOCK_TIMEOUT_SECONDS:-300}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,api}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8010/api/v1/health/', timeout=2)"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    ports:
      - "127.0.0.1:${ORDERSYNC_API_PORT:-8010}:8010"
    volumes:
      - .:/app


  worker:
    build:
      context: .
    restart: unless-stopped
    command: ["python", "manage.py", "process_sync_jobs", "--poll-interval=1"]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ordersync}
      POSTGRES_USER: ${POSTGRES_USER:-ordersync}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ordersync_local}
      POSTGRES_CONN_MAX_AGE: ${POSTGRES_CONN_MAX_AGE:-0}
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-ordersync-insecure-local-key}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-true}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,api}
      ORDERSYNC_MAX_ATTEMPTS: ${ORDERSYNC_MAX_ATTEMPTS:-3}
      ORDERSYNC_RETRY_DELAYS_SECONDS: ${ORDERSYNC_RETRY_DELAYS_SECONDS:-5,30}
      ORDERSYNC_JOB_LOCK_TIMEOUT_SECONDS: ${ORDERSYNC_JOB_LOCK_TIMEOUT_SECONDS:-300}
    depends_on:
      api:
        condition: service_healthy
    volumes:
      - .:/app
volumes:
  ordersync_postgres_data:

