[build-system]
requires = ["setuptools>=80.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ordersync-lab"
version = "0.1.0"
description = "A fictional order synchronization lab focused on reliable integrations and AWS-ready design."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
authors = [{ name = "Jesus Rojas" }]
dependencies = [
  "Django==5.2.17",
  "djangorestframework==3.17.2",
  "psycopg[binary]==3.3.6",
]

[project.optional-dependencies]
dev = [
  "pytest==9.1.1",
  "pytest-django==4.14.0",
  "ruff==0.16.9",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "ordersync_lab.settings"
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["migrations"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "DJ"]
ignore = ["DJ001"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

